<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent2API · 登录</title>
  <!-- 组件库产物（ui-kit + Tailwind，由 ui-islands 构建）：与主面板同一份。
       页面外壳的取值也改走它的 --ui-* 令牌，不再自己硬编码一套深色变量。 -->
  <link rel="stylesheet" href="islands/ui.css">
  <style>
    /* 样式表里只留 html/body 与第三方 widget 的样式：卡片、品牌区、表单都由 React 岛
       （ui-islands/src/islands/login-page.tsx）用组件库的工具类渲染。 */
    body {
      /* margin: 0 与 box-sizing 是原先那条 `* { margin:0; padding:0; box-sizing:border-box }`
         全局重置的遗留：组件库的产物刻意不含 preflight（见 index.html 里 ui.css 那条注释），
         全局重置已随本次改写删掉，缺了这两条 body 会吃浏览器默认的 8px 外边距 ——
         页面立刻多出 16px 纵向溢出，右侧冒出一条滚动条。 */
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 14px/1.6 var(--ui-font-sans, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif);
      color: var(--ui-foreground);
      /* 顶部主色光晕 + 页面底色：原独立页那层深蓝渐变的等价物，取值改走令牌 */
      background: radial-gradient(1200px 600px at 50% -10%,
        color-mix(in srgb, var(--ui-primary) 26%, var(--ui-background)) 0%,
        var(--ui-background) 55%);
    }
    /* 挂载点自身不生成盒子：卡片直接作为 body 的 flex 子项参与居中（与主面板的 .island
       同一手法）—— 中间多一层 div 的话，卡片的 min(400px,100%) 会按那一层的收缩宽度
       计算，窄窗口下就偏了 */
    #login-app { display: contents; }
    /* 机器人校验组件（ui/panel-captcha.js 定义的 <panel-captcha>）：浅色 DOM、
       样式留在页面这一层，观感与迁移前的 altcha widget 一致 —— 一行居中、
       圆角描边方框、左侧指示圈（求解中转圈 / 通过打勾 / 失败描红）。
       组件只在开启校验时占位：校验关闭后它被隐藏，间距随 display:none 一起消失，
       与按钮之间的间隔改由 #submit 自己的 margin-top 撑住（两侧各 20px）。 */
    panel-captcha { display: block; margin: 20px 0 0; }
    #submit { margin-top: 20px; }
    panel-captcha .pc-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 10px 14px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-card);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    panel-captcha .pc-box:hover { border-color: var(--ui-border-strong); }
    panel-captcha .pc-indicator {
      width: 18px;
      height: 18px;
      flex: none;
      border: 2px solid var(--ui-border-strong);
      border-radius: 4px;
    }
    panel-captcha[state='verifying'] .pc-indicator {
      border-radius: 50%;
      border-color: color-mix(in srgb, var(--ui-border-strong) 40%, transparent);
      border-top-color: var(--ui-primary);
      animation: pc-spin 0.7s linear infinite;
    }
    panel-captcha[state='verified'] .pc-indicator {
      border-color: var(--ui-success);
      background: var(--ui-success);
    }
    panel-captcha[state='verified'] .pc-indicator::after {
      content: '';
      display: block;
      width: 5px;
      height: 9px;
      margin: 0 auto 2px;
      border: solid var(--ui-success-foreground);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    panel-captcha[state='verified'] .pc-label { color: var(--ui-success); }
    panel-captcha[state='error'] .pc-indicator { border-color: var(--ui-destructive); }
    panel-captcha[state='error'] .pc-label { color: var(--ui-destructive); }
    @keyframes pc-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 整页界面由 React 岛渲染（ui-islands/src/islands/login-page.tsx，随 islands/ui.js
       一起加载；岛直接渲染卡片本身，不在这里写静态骨架）。
       这个 <script> 必须排在 #login-app 之后、且不能加 defer/async：下面那段登录脚本
       要同步拿到岛渲染出来的 #username / #password / #submit / #error / #mode-tip。 -->
  <div id="login-app"></div>
  <script src="islands/ui.js"></script>

  <!-- 机器人校验组件（自定义元素定义，协议见 server::altcha 与文件头注释）。
       必须排在下面那段内联脚本之前：脚本挂在元素上的 verified/expired 监听、
       以及提交失败时的 reset() 都要求元素已经升级完成。 -->
  <script src="panel-captcha.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var tip = $('mode-tip');
      var errorEl = $('error');
      var button = $('submit');
      var isSetup = false;

      // 已登录（access 会话有效）→ 直接进面板；401 → 留在本页
      fetch('/api/session').then(function (resp) {
        if (resp.ok) window.location.href = '/';
      }).catch(function () { /* 未登录，留在本页 */ });

      // ── 机器人校验（proof-of-work，协议见 server::altcha）──
      // 页面加载即领题求解（组件自己干）→ 绿勾「验证成功」，verified 事件给出
      // 随提交的 payload。payload 一次性（服务器用后即焚）：提交失败要 reset()
      // 重新验证。网关关闭了校验时领题回 400，整个组件隐藏，提交不带 payload。
      var captchaPayload = null;
      var captchaRequired = true; // 探测完成前先按「需要验证」保守处理
      var widget = document.getElementById('captcha');

      widget.addEventListener('verified', function (event) {
        captchaPayload = (event.detail && event.detail.payload) || null;
      });
      widget.addEventListener('expired', function () {
        captchaPayload = null;
      });

      // 探测开关：未启用时领题回 400，隐藏验证行（提交自然不带 payload）
      fetch('/api/panel/captcha').then(function (resp) {
        if (resp.ok) return;
        captchaRequired = false;
        widget.style.display = 'none';
      }).catch(function () { /* 网关不可达：组件自会显示失败 */ });

      // 决定模式：没有任何管理员 → 注册；否则登录
      fetch('/api/panel/status').then(function (resp) { return resp.json(); }).then(function (data) {
        var registered = data && data.data && data.data.registered;
        isSetup = !registered;
        tip.textContent = isSetup
          ? '首次使用：创建一个管理员账号，用于登录此面板'
          : '请输入管理员账号与密码';
        $('submit').textContent = isSetup ? '创建账号并进入面板' : '登录';
        if (isSetup) $('password').placeholder = '设置密码（至少 8 位）';
      }).catch(function () {
        tip.textContent = '无法连接网关，请确认服务已启动';
      });

      function doSubmit(username, password) {
        button.disabled = true;
        errorEl.textContent = '';
        var body = { username: username, password: password };
        if (captchaPayload) body.captcha = captchaPayload;
        fetch(isSetup ? '/api/panel/setup' : '/api/panel/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(function (resp) {
          return resp.json().then(function (payload) { return { ok: resp.ok, payload: payload }; });
        }).then(function (result) {
          if (result.ok) {
            window.location.href = '/';
            return;
          }
          var detail = result.payload && (result.payload.error || result.payload);
          // 后端的错误信封是 {success:false, error:"账号或密码不正确"}，error
          // 是字符串；也兼容 {message:"…"} 形态的对象
          if (detail && typeof detail === 'object') detail = detail.message;
          errorEl.textContent = detail || '请求失败，请重试';
          button.disabled = false;
          captchaPayload = null; // payload 是一次性的：失败后重新验证
          if (captchaRequired) widget.reset();
        }).catch(function () {
          errorEl.textContent = '无法连接网关';
          button.disabled = false;
          captchaPayload = null;
          if (captchaRequired) widget.reset();
        });
      }

      // capture：先于官方 widget 的 form 集成逻辑跑，未验证时给出明确提示
      $('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var username = $('username').value.trim();
        var password = $('password').value;
        if (!username || !password) {
          errorEl.textContent = '请填写账号与密码';
          return;
        }
        if (captchaRequired && !captchaPayload) {
          errorEl.textContent = '请先勾选「我不是机器人」完成验证';
          return;
        }
        doSubmit(username, password);
      }, true);
    })();
  </script>
</body>
</html>
